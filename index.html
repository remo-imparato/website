<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Welcome — Coming Soon</title>
	<style>
		* { box-sizing: border-box; }
		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 24px;
			color: #f4f6fb;
			background: radial-gradient(circle at 20% 20%, #26385b 0, transparent 38%), #111827;
			font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
			text-align: center;
		}
		main {
			width: min(100%, 680px);
			padding: clamp(32px, 8vw, 72px);
			border: 1px solid #ffffff1a;
			border-radius: 24px;
			background: #192438d9;
			box-shadow: 0 24px 70px #0005;
		}
		.mark {
			display: grid;
			place-items: center;
			width: 64px;
			height: 64px;
			margin: 0 auto 28px;
			border-radius: 18px;
			background: #829bff22;
			color: #9badff;
			font-size: 30px;
		}
		.label {
			margin: 0 0 14px;
			color: #9badff;
			font-size: .78rem;
			font-weight: 700;
			letter-spacing: .16em;
			text-transform: uppercase;
		}
		h1 { margin: 0; font-size: clamp(2.4rem, 8vw, 4rem); line-height: 1.08; letter-spacing: -.05em; }
		.message { max-width: 480px; margin: 22px auto 0; color: #b7c1d1; font-size: 1.08rem; line-height: 1.7; }
		.status { display: inline-flex; align-items: center; gap: 9px; margin-top: 28px; color: #dce4ef; font-size: .9rem; }
		.dot { width: 8px; height: 8px; border-radius: 50%; background: #55d6a5; }
		footer { margin-top: 46px; color: #8490a3; font-size: .85rem; }
	</style>
</head>
<body>
	<main>
		<div class="mark" aria-hidden="true">✦</div>
		<p class="label">A new experience is on its way</p>
		<h1>Welcome.<br>We’re building something great.</h1>
		<p class="message">Thanks for stopping by. Our website is currently under construction, but we’ll be ready to welcome you properly soon.</p>
		<div class="status"><span class="dot" aria-hidden="true"></span> Work in progress</div>
		<footer>Thanks for your patience. See you soon.</footer>
	</main>
</body>
</html>
